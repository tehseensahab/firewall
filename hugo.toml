[pagination]
  pagerSize = 12

[params]
  description = "Practical cybersecurity writing for engineering teams that ship fast."
  tagline = "Security that ships, not slideware."
  author = "FirewallSync Editorial"
  ogDefault = "/og-default.jpg"

