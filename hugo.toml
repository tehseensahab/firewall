[markup.goldmark.renderer]
  unsafe = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMSFull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true

[outputFormats.Markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true

[outputFormats.Articles]
  mediaType = "application/json"
  baseName = "articles"

[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFull", "Articles"]
  page = ["HTML", "Markdown"]
