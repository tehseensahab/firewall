<footer class="site-footer">
  <div class="wrap">
    <nav class="footer-nav" aria-label="Footer">
      {{- range site.Menus.main }}{{ if partial "menu-visible.html" . }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}{{ end }}
    </nav>
    <nav class="footer-nav footer-legal" aria-label="Policies">
      {{- range site.Menus.footer }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    </nav>
    <p class="footer-copy">© {{ now.Format "2006" }} {{ site.Title }}. {{ site.Params.description }}</p>
  </div>
</footer>
