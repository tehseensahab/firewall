{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="meta">
    {{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read
    {{ with .Params.author }} · By {{ . }}{{ end }}
  </p>
  {{ with .Params.tags }}
  <p class="tag-row">{{ range . }}<a class="tag-chip small" href="/tags/{{ . | urlize }}/">{{ . }}</a>{{ end }}</p>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
