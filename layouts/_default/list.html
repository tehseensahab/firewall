{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Content }}<div class="page-content">{{ .Content }}</div>{{ end }}
<section class="post-list">
  {{ range .Pages }}
  <article class="post-card">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="meta">{{ .Date.Format "Jan 2, 2006" }}</p>
    <p>{{ .Summary }}</p>
  </article>
  {{ end }}
</section>
{{ end }}
