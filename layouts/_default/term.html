{{ define "main" }}
<h1>Topic: {{ .Title }}</h1>
<section class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <article class="post-card">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="meta">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read{{ with .Params.author }} · {{ . }}{{ end }}</p>
    <p>{{ .Summary }}</p>
  </article>
  {{ end }}
</section>
{{ end }}
